name: Update fuel prices

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (runs on the default branch only)
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest prices from retailer feeds
        run: node scripts/fetch-prices.mjs

      - name: Commit updated data
        run: |
          git config user.name "fuel-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/stations.json
          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "Update fuel prices ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
